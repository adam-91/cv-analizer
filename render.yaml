services:
  - type: web
    name: cv-analizer-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.8
      - key: MODEL_NAME
        value: gemini-3.8-flash
      - key: FALLBACK_MODELS
        value: gemini-3.6-flash,gemini-3.5-flash-lite
      - key: GOOGLE_API_KEY
        sync: false
    autoDeploy: true

staticSites:
  - name: cv-analizer-web
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    envVars:
      - key: VITE_API_URL
        value: https://cv-analizer-api.onrender.com
    autoDeploy: true
